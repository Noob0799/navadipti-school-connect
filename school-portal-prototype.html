<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<title>School Portal Prototype</title>
<style>
/* Chalkboard header, paper-white surfaces, role colours: blue principal, emerald teacher, tangerine student. */
:root{--bg:#F2F6F3;--surface:#FFFFFF;--fg:#16302A;--muted:#58706A;--line:#D8E4DE;--chalk:#1F3430;--chalk-fg:#F4F7F2;--marigold:#F4B73E;--principal:#1D4E89;--principal-fg:#FFFFFF;--accent:var(--principal);--accent-fg:var(--principal-fg);--ok:#2A9461;--ok-fg:#FFFFFF;--warn:#F2A900;--warn-fg:#16302A;--bad:#C8413B;--bad-fg:#FFFFFF;--info:#58706A;--info-fg:#FFFFFF;--font-body:"Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;--font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1816;--surface:#152420;--fg:#E6F0EB;--muted:#9BB3AB;--line:#26403A;--chalk:#1B2F2A;--chalk-fg:#EEF5F0;--principal:#7FB8F5;--principal-fg:#0B1622;--ok:#5CC48A;--ok-fg:#06190F;--warn:#F4B73E;--warn-fg:#1E1606;--bad:#F07A73;--bad-fg:#2A0807;--info:#3A4F49;--info-fg:#EEF5F0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1816;--surface:#152420;--fg:#E6F0EB;--muted:#9BB3AB;--line:#26403A;--chalk:#1B2F2A;--chalk-fg:#EEF5F0;--principal:#7FB8F5;--principal-fg:#0B1622;--ok:#5CC48A;--ok-fg:#06190F;--warn:#F4B73E;--warn-fg:#1E1606;--bad:#F07A73;--bad-fg:#2A0807;--info:#3A4F49;--info-fg:#EEF5F0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body)}
h1,h2,h3,.brand{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:30px;font-weight:800;line-height:1.1;margin:0 0 6px}
h3{font-size:17px;font-weight:700;margin:0 0 6px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.sumline{margin:6px 0 0}
.mono{font-family:var(--font-mono);font-size:13px}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--chalk);color:var(--chalk-fg);border-bottom:4px solid var(--accent)}
.brand{font-weight:800;font-size:20px;white-space:nowrap}
.brand::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--marigold);margin-right:9px;vertical-align:1px}
.who{margin-left:auto;font-size:14px;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:11}
.note{padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.note:last-child{border-bottom:0}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 0}
.side a{display:block;padding:10px 18px;color:var(--fg);text-decoration:none;border-left:4px solid transparent;font-weight:700}
.side a:hover{background:var(--bg)}

main{padding:24px 18px;min-width:0;background-image:radial-gradient(var(--line) 1.1px,transparent 1.3px);background-size:22px 22px}
@media (max-width:700px){
  .layout{grid-template-columns:minmax(0,1fr)}

  .side a{border-left:0;border-bottom:4px solid transparent;white-space:nowrap}
  .side a.on{border-bottom-color:var(--accent)}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}
@media (max-width:700px){.split{grid-template-columns:minmax(0,1fr)}}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--info);color:var(--info-fg);white-space:nowrap}
.chip.pass{background:var(--ok);color:var(--ok-fg)}
.chip.fail{background:var(--bad);color:var(--bad-fg)}
.chip.pend{background:var(--warn);color:var(--warn-fg)}
.hwitem{cursor:pointer;margin-bottom:10px}
.hwitem.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.icon{position:relative;background:transparent;color:var(--fg);border:1px solid var(--line)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:var(--bad-fg);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;min-width:18px;text-align:center}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:1px solid transparent;border-radius:10px;padding:9px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.top .icon,.top .ghost{color:var(--chalk-fg);border-color:rgba(244,247,242,.3)}
.top .ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%;max-width:100%}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
input[type=file]{padding:6px}
label{display:block;margin-bottom:12px;font-size:14px;font-weight:700;color:var(--muted)}
label.inline{display:inline-flex;align-items:center;gap:6px;margin:0 14px 8px 0;color:var(--fg);font-weight:400}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.hero{background:var(--chalk);color:var(--chalk-fg);padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-width:0;overflow:hidden}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--marigold)}
.hero h2{font-weight:800;font-size:clamp(36px,4.8vw,60px);line-height:1;letter-spacing:-.025em;margin:14px 0 6px;text-wrap:balance}
.hero p{margin:0;max-width:36ch;font-size:18px;opacity:.88}
.underline{display:block;width:min(320px,80%);height:auto;margin:6px 0 0}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.meta span{font-family:var(--font-mono);font-size:12px;border:1px solid rgba(244,247,242,.3);border-radius:6px;padding:4px 9px;opacity:.85}
.auth{padding:52px 44px;display:grid;align-content:center;background:var(--bg);min-width:0}
.auth-card{width:100%;max-width:420px;justify-self:center}
.auth-card h3{font-size:26px;font-weight:800;margin:0 0 4px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.rolecards{display:grid;gap:10px}
button.rolecard{display:grid;gap:2px;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 24px;position:relative;overflow:hidden}
button.rolecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--r)}
button.rolecard:hover{border-color:var(--r)}
button.rolecard strong{font-family:var(--font-display);font-size:18px;font-weight:800}
button.rolecard span{font-size:14px;color:var(--muted);font-weight:400}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}.hero{padding:30px 24px;gap:20px}.auth{padding:28px 18px}}
dialog{border:0;border-radius:14px;padding:0;width:min(980px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,18,.6)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--chalk);color:var(--chalk-fg)}
.dhead h3{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.dhead button.ghost{color:var(--chalk-fg);border-color:rgba(244,247,242,.3)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:minmax(0,1fr);height:min(78vh,760px)}
.dbody.solo{grid-template-columns:minmax(0,1fr)}
.dpreview{padding:16px;background:var(--line);min-width:0;min-height:0;overflow:auto}
.dpreview .stage{max-height:none;background:transparent;padding:0;overflow:visible}
.dpanel{padding:18px;border-left:1px solid var(--line);min-width:0;overflow:auto}
@media (max-width:700px){dialog{overflow:auto}.dbody{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}.dbody.solo{grid-template-columns:minmax(0,1fr)}.dpreview{overflow:visible}.dpanel{border-left:0;border-top:1px solid var(--line)}.scan{max-height:60vh}}
.vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;min-width:0}
.vhead b{overflow-wrap:anywhere}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stage{background:var(--line);border-radius:12px;padding:16px;overflow:auto;max-height:70vh}
.paper{background:#FFFFFF;color:#1E2430;max-width:640px;width:100%;margin:0 auto;padding:28px 32px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.paper h4{margin:0 0 14px;font-size:17px;font-family:Georgia,serif;text-wrap:balance}
.paper p{margin:0 0 10px;font-family:Georgia,serif;line-height:1.6;overflow-wrap:anywhere}
.paper p.hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;color:#1F3A93;font-size:17px}
.scan{display:block;max-width:100%;width:auto;height:auto;max-height:calc(min(78vh,760px) - 110px);object-fit:contain;margin:0 auto;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,16px);background:var(--chalk);color:var(--chalk-fg);padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);font-size:14px;font-weight:700;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="viewer" aria-labelledby="vtitle">
  <div class="dhead"><h3 id="vtitle"></h3><button class="ghost" data-action="close-file">Close</button></div>
  <div id="vbody"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLASSES = ['Nursery','Transition','Class 1','Class 2','Class 3','Class 4','Class 5'];
const SUBJECTS = ['English','Bengali','Mathematics','Drawing','General Knowledge','Science','History','Geography'];
const ACCENT = { principal:['var(--principal)','var(--principal-fg)'], teacher:['#0F8B6D','#FFFFFF'], student:['#E8772E','#1B1206'] };
const ROLE_COLOR = { principal:'var(--principal)', teacher:'#0F8B6D', student:'#E8772E' };
const NAV = {
  principal:[['dashboard','Dashboard'],['teachers','Teachers'],['students','Students'],['promotion','Promotion'],['sessions','Sessions'],['announcements','Announcements']],
  teacher:[['dashboard','Dashboard'],['homework','Homework'],['tests','Tests & grading']],
  student:[['dashboard','Home'],['homework','Homework'],['tests','Tests'],['results','Results']]
};
const ME = { principal:{name:'Principal Gupta'}, teacher:{name:'Mrs. Sen', id:'t1'}, student:{name:'Rahul Sen', id:'s1'} };

/* Sample scans are inline SVG images. PDFs are shown as paper pages with their text. */
const scanUri = (title, lines) => {
  const body = lines.map((l,i) => `<text x="40" y="${130+i*48}" font-family="Georgia,serif" font-size="22" fill="#23408E">${l}</text>`).join('');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="#FFFDF7"/><rect x="20" y="20" width="560" height="760" fill="none" stroke="#D9CFBE" stroke-width="2"/><text x="40" y="78" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#1E2430">${title}</text>${body}<circle cx="520" cy="110" r="22" fill="none" stroke="#2E7D32" stroke-width="4"/></svg>`);
};

const D = {
  session:{ history:['2025-26'], active:'2026-27', upcoming:'2027-28' },
  teachers:[
    {id:'t1',name:'Mrs. Sen',phone:'9000000001',subjects:['Mathematics','English'],active:true},
    {id:'t2',name:'Mr. Das',phone:'9000000002',subjects:['Science','Geography','History'],active:true},
    {id:'t3',name:'Ms. Roy',phone:'9000000003',subjects:['Bengali','Drawing','General Knowledge'],active:false}
  ],
  students:[
    {id:'s1',name:'Rahul Sen',school:'ND-2026-0001',cls:'Class 4',status:'enrolled'},
    {id:'s2',name:'Ananya Dey',school:'ND-2026-0002',cls:'Class 4',status:'enrolled'},
    {id:'s3',name:'Imran Khan',school:'ND-2026-0003',cls:'Class 4',status:'enrolled'},
    {id:'s4',name:'Priya Paul',school:'ND-2026-0004',cls:'Class 4',status:'withdrawn'}
  ],
  homework:[
    {id:'h1',cls:'Class 4',subject:'Mathematics',title:'Chapter 5 exercises',due:'2026-10-08',
     material:[
       {name:'ch5_questions.pdf',kind:'pdf',pages:[
         {heading:'Chapter 5 · Exercises',lines:['1. Add 2,345 and 1,678.','2. Subtract 3,004 from 5,210.','3. Rita had 45 stickers and gave away 5. How many are left?']},
         {heading:'Page 2',lines:['4. Multiply 125 by 6.','5. Find the missing number: 7 × __ = 56.']}
       ]},
       {name:'place_value_chart.png',kind:'image',src:scanUri('Place value chart',['Thousands | Hundreds | Tens | Ones','Example: 4,023 = 4 thousands, 0 hundreds, 2 tens, 3 ones'])}
     ],
     subs:[
       {sid:'s1',done:true,work:{name:'ch5_rahul.pdf',kind:'pdf',pages:[{heading:'Rahul Sen · Chapter 5',lines:['1. 4,023','2. 2,206','3. 45 - 5 = 40 stickers'],hand:true}]},remark:''},
       {sid:'s2',done:true,work:{name:'ch5_ananya.jpg',kind:'image',src:scanUri('Ananya · Chapter 5',['1. 4,023','2. 2,206','3. 40 stickers'])},remark:''},
       {sid:'s3',done:false,work:null,remark:''}
     ]},
    {id:'h2',cls:'Class 4',subject:'English',title:'Reading: The Kind Crow',due:'2026-10-10',
     material:[
       {name:'the_kind_crow.pdf',kind:'pdf',pages:[{heading:'The Kind Crow',lines:['Once upon a time a crow lived by a river. One hot day it found very little food.','Read the story aloud. Then answer: Why did the crow share its food?']}]}
     ],
     subs:[
       {sid:'s1',done:false,work:null,remark:''},
       {sid:'s2',done:true,work:{name:'reading.pdf',kind:'pdf',pages:[{heading:'Ananya Dey · Reading',lines:['The crow shared its food because it was kind.'],hand:true}]},remark:'Lovely expression'},
       {sid:'s3',done:false,work:null,remark:''}
     ]}
  ],
  tests:[
    {id:'x1',cls:'Class 4',subject:'English',term:'Half Yearly',max:50,pass:20,
     paper:{name:'english_half_yearly_paper.pdf',kind:'pdf',pages:[
       {heading:'English · Half Yearly · Out of 50',lines:['Section A: Read the passage and answer.','Q1. Why did the crow share its food?','Q2. Give a synonym of happy.']},
       {heading:'Section B',lines:['Write a short letter to a friend about a trip you enjoyed.']}
     ]},
     marks:{s1:42,s2:15,s3:null},
     remarks:{s2:'Good use of expression'},
     answers:{s2:{name:'eng_hy_ananya.jpg',kind:'image',src:scanUri('Ananya · English HY',['Q1. The crow was kind.','Q2. Glad'])}},
     answered:{s1:false,s2:true,s3:false},released:false},
    {id:'x2',cls:'Class 4',subject:'Mathematics',term:'Class Test 1',max:25,pass:10,
     paper:{name:'math_ct1_paper.pdf',kind:'pdf',pages:[{heading:'Mathematics · Class Test 1 · Out of 25',lines:['1. Write 3,256 in words.','2. 1,450 + 2,118 = ?','3. A pencil costs 6 rupees. Find the cost of 4 pencils.']}]},
     marks:{s1:20,s2:8,s3:null},
     remarks:{s1:'Neat work'},
     answers:{s1:{name:'math_ct1_rahul.pdf',kind:'pdf',pages:[{heading:'Rahul Sen · Class Test 1',lines:['1. Three thousand two hundred fifty six','2. 3,568','3. 24 rupees'],hand:true}]},s2:{name:'math_ct1_ananya.pdf',kind:'pdf',pages:[{heading:'Ananya Dey · Class Test 1',lines:['1. Three thousand two hundred fifty six','2. 3,568'],hand:true}]}},
     answered:{s1:true,s2:true,s3:false},released:true}
  ],
  promo:{ s1:{Mathematics:128,English:96,Science:110}, s2:{Mathematics:44,English:121,Science:70}, s3:{Mathematics:95,English:58,Science:101} },
  announcements:[{id:'a1',title:'Annual sports day',body:'Held on 15 December at the school ground.',by:'Principal Gupta'}],
  notes:[{text:'New syllabus: Class 4 Mathematics, Half Yearly'},{text:'New homework: Class 4 English, Reading'},{text:'Grades released: Class 3 Science'}]
};

const st = { role:null, bell:false, unread:3, teacherForm:false, enrollForm:false, annForm:false, hwForm:false, openHw:'h1', testId:'x1', promoChecked:{s1:true,s2:true,s3:false}, fileKey:null, page:0, lastHash:null };

const byId = (list, id) => list.find(x => x.id === id);
const mySubjects = () => byId(D.teachers, ME.teacher.id).subjects;
const studentsIn = cls => D.students.filter(s => s.cls === cls && s.status === 'enrolled');
const chip = (kind, label) => `<span class="chip ${kind}">${esc(label)}</span>`;
const scoreChip = (m, max, pass) => m == null ? chip('pend','Not graded') : chip(m >= pass ? 'pass' : 'fail', `${m}/${max} ${m >= pass ? 'Pass' : 'Fail'}`);
const note = t => { D.notes.unshift({text:t}); st.unread++; };
const nextLabel = l => { const y = Number(l.slice(0,4)) + 1; return `${y}-${String((y+1)%100).padStart(2,'0')}`; };
const openBtn = (key, label, cls='ghost') => `<button class="${cls}" data-action="open-file" data-key="${key}">${esc(label)}</button>`;
let toastTimer;
function flash(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

function readFile(file, done){
  if(file.type.startsWith('image/')){
    const r = new FileReader();
    r.onload = () => done({name:file.name, kind:'image', src:r.result});
    r.readAsDataURL(file);
  } else {
    done({name:file.name, kind:'pdf', pages:[{heading:file.name, lines:['Preview of uploaded PDFs appears here once the real PDF viewer is connected.'], hand:true}]});
  }
}

/* ---------- File popup ---------- */
function fileFor(key){
  const [t, a, b] = key.split(':');
  if(t==='hw') return byId(D.homework,a).subs.find(s=>s.sid===b)?.work;
  if(t==='hm') return byId(D.homework,a).material[Number(b)];
  if(t==='ta') return byId(D.tests,a).answers?.[b];
  if(t==='tp') return byId(D.tests,a).paper;
}
const paper = pg => `<div class="paper"><h4>${esc(pg.heading)}</h4>${pg.lines.map(l=>`<p class="${pg.hand?'hand':''}">${esc(l)}</p>`).join('')}</div>`;
function viewer(f){
  if(!f) return '<p class="muted">Nothing uploaded yet.</p>';
  if(f.kind==='image') return `<div class="vhead"><b>${esc(f.name)}</b>${chip('info','Image')}</div><div class="stage"><img class="scan" alt="${esc(f.name)}" src="${f.src}"></div>`;
  const pages = f.pages || [];
  if(!pages.length) return '<p class="muted">This file is empty.</p>';
  const i = Math.min(st.page, pages.length - 1);
  const pager = pages.length > 1 ? `<div class="pager"><button class="ghost" data-action="page" data-d="-1" ${i<=0?'disabled':''}>Previous</button><span class="muted">Page ${i+1} of ${pages.length}</span><button class="ghost" data-action="page" data-d="1" ${i>=pages.length-1?'disabled':''}>Next</button></div>` : '';
  return `<div class="vhead"><b>${esc(f.name)}</b>${chip('info','PDF')}</div>${pager}<div class="stage">${paper(pages[i])}</div>`;
}
const POPUP_TITLE = {hw:'Homework submission', ta:'Test answer', hm:'Study material', tp:'Question paper'};

function gradePanel(t, a, b){
  if(t==='hw'){
    const x = byId(D.homework,a).subs.find(s=>s.sid===b);
    return `<aside class="dpanel"><h3>Remark</h3>
      <label>Teacher remark<textarea id="r-text" rows="6">${esc(x.remark)}</textarea></label>
      <button data-action="save-remark" data-id="${a}" data-sid="${b}">Save remark</button></aside>`;
  }
  const ts = byId(D.tests,a);
  const m = ts.marks[b];
  return `<aside class="dpanel"><h3>Grade</h3>
    <label>Marks (out of ${ts.max})<input id="g-marks" type="number" min="0" max="${ts.max}" value="${m??''}" data-max="${ts.max}" data-pass="${ts.pass}"></label>
    <p id="g-result">${scoreChip(m, ts.max, ts.pass)}</p>
    <label>Remark<textarea id="g-remark" rows="5">${esc(ts.remarks?.[b] ?? '')}</textarea></label>
    <button data-action="save-grade" data-id="${a}" data-sid="${b}">Save grade</button></aside>`;
}

function renderPopup(){
  const [t, a, b] = st.fileKey.split(':');
  const f = fileFor(st.fileKey);
  const canGrade = st.role==='teacher' && (t==='hw'||t==='ta') && f;
  $('#vtitle').textContent = `${POPUP_TITLE[t]}${f ? ' · ' + f.name : ''}`;
  $('#vbody').innerHTML = `<div class="dbody${canGrade ? '' : ' solo'}"><div class="dpreview">${viewer(f)}</div>${canGrade ? gradePanel(t,a,b) : ''}</div>`;
}
function openPopup(){
  renderPopup();
  const dlg = $('#viewer');
  if(!dlg.open) dlg.showModal();
}
$('#viewer').addEventListener('close', () => { st.fileKey = null; });

function bellPanel(){
  const items = D.notes.slice(0,6).map(n=>`<div class="note">${esc(n.text)}</div>`).join('') || '<p class="hint">Nothing new.</p>';
  return `<div class="bellpanel">${items}</div>`;
}

function shell(page, body){
  const role = st.role;
  const nav = NAV[role].map(([k,l]) => `<a href="#${role}/${k}" class="${k===page?'on':''}">${l}</a>`).join('');
  return `<header class="top">
    <div class="brand">School Portal</div>
    <div class="who">${esc(ME[role].name)}<span class="role">${role}</span></div>
    <div class="bellwrap">
      <button class="icon" data-action="bell" aria-label="Notifications, ${st.unread} unread" aria-expanded="${st.bell}">Alerts${st.unread?`<span class="badge">${st.unread}</span>`:''}</button>
      ${st.bell?bellPanel():''}
    </div>
    <button class="ghost" data-action="logout">Log out</button>
  </header>
  <div class="layout"><nav class="side">${nav}</nav><main>${body}</main></div>`;
}

/* ---------- Principal ---------- */
function pDashboard(){
  const cards = D.teachers.map(t => {
    const hw = D.homework.filter(h=>t.subjects.includes(h.subject)).reduce((n,h)=>n+h.subs.filter(s=>s.done&&!s.remark).length,0);
    const ts = D.tests.filter(x=>t.subjects.includes(x.subject)).reduce((n,x)=>n+Object.values(x.marks).filter(m=>m==null).length,0);
    const status = !t.active ? chip('info','Inactive') : (hw+ts ? chip('pend','Work pending') : chip('pass','All caught up'));
    return `<div class="card"><h3>${esc(t.name)} ${status}</h3><p class="muted sumline">${esc(t.subjects.join(', '))}</p><p class="sumline">${hw} homework to review<br>${ts} tests to grade</p></div>`;
  }).join('');
  return `<h1>Dashboard</h1><p class="muted">Pending work per teacher</p>
    <div class="grid">${cards}</div>
    <div class="card"><h3>Sessions</h3>
      <p class="sumline">Active <b class="mono">${esc(D.session.active)}</b> · Next <b class="mono">${esc(D.session.upcoming ?? 'not created')}</b></p>
      ${D.session.upcoming ? '' : '<p class="hint">Create the next session before promoting students.</p>'}
      <a href="#principal/sessions">Manage sessions</a></div>`;
}

function pTeachers(){

function pStudents(){

function pPromotion(){
  const list = studentsIn('Class 4');
  const subs = ['Mathematics','English','Science'];
  const sel = list.filter(s=>st.promoChecked[s.id]).length;
  const ready = !!D.session.upcoming;
  const rows = list.map(s => {
    const tot = D.promo[s.id] || {};
    const cells = subs.map(x => { const v = tot[x] ?? 0; return `<td><span class="mono">${v}/150</span> ${chip(v>=60?'pass':'fail', v>=60?'Pass':'Fail')}</td>`; }).join('');
    const on = !!st.promoChecked[s.id];
    return `<tr><td><input type="checkbox" data-action="promo-check" data-id="${s.id}" ${on?'checked':''} aria-label="Promote ${esc(s.name)}"></td><td>${esc(s.name)}</td>${cells}<td>${on?chip('pass','Promote'):chip('info','Retain')}</td></tr>`;
  }).join('');
  return `<h1>Promotion review · Class 4</h1>
    <p class="muted">${ready ? `Promoting into <b class="mono">${esc(D.session.upcoming)}</b>.` : 'No upcoming session yet.'} Checked students move up. Unchecked students repeat Class 4. Totals are out of 150 per subject, pass mark 60.</p>
    <div class="tablewrap"><table><tr><th></th><th>Student</th>${subs.map(x=>`<th>${x}</th>`).join('')}<th>Decision</th></tr>${rows}</table></div>
    <button data-action="promote" ${ready?'':'disabled'}>Promote ${sel}, retain ${list.length-sel}</button>
    ${ready ? '' : '<p class="hint">Create the next session first.</p>'}`;
}

function pSessions(){
  const list = [...D.session.history.map(l=>({l,s:'Closed'})), {l:D.session.active,s:'Active'}, ...(D.session.upcoming?[{l:D.session.upcoming,s:'Upcoming'}]:[])];
  const rows = list.map(x => `<tr><td class="mono">${esc(x.l)}</td><td>${chip(x.s==='Active'?'pass':x.s==='Upcoming'?'pend':'info', x.s)}</td></tr>`).join('');
  const action = D.session.upcoming
    ? `<button data-action="activate-next">Activate ${esc(D.session.upcoming)}</button><p class="hint">Closes ${esc(D.session.active)}. Teachers and students then see ${esc(D.session.upcoming)}.</p>`
    : `<button data-action="create-session">Create next session (${esc(nextLabel(D.session.active))})</button><p class="hint">Creates classes, subjects and terms from the fixed template.</p>`;
  return `<h1>Academic sessions</h1>
    <div class="tablewrap"><table><tr><th>Session</th><th>Status</th></tr>${rows}</table></div>
    <div class="card">${action}</div>`;
}

/* ---------- Teacher ---------- */
function tDashboard(){
  const mine = mySubjects();
  const hwCards = D.homework.filter(h=>mine.includes(h.subject)).map(h => {
    const n = h.subs.filter(s=>s.done&&!s.remark).length;
    return `<div class="card"><h3>${esc(h.cls)} · ${esc(h.subject)} ${n?chip('pend',n+' to review'):chip('pass','Caught up')}</h3><p class="sumline">${esc(h.title)}</p><p><a href="#teacher/homework">Review homework</a></p></div>`;
  }).join('');
  const testCards = D.tests.filter(x=>mine.includes(x.subject)).map(x => {
    const n = Object.values(x.marks).filter(m=>m==null).length;
    return `<div class="card"><h3>${esc(x.cls)} · ${esc(x.subject)} ${n?chip('pend',n+' to grade'):chip('pass','All graded')}</h3><p class="sumline">${esc(x.term)}</p><p><a href="#teacher/tests">Grade test</a></p></div>`;
  }).join('');
  return `<h1>Dashboard</h1>
    <h3>Homework to review</h3><div class="grid">${hwCards}</div>
    <h3>Tests to grade</h3><div class="grid">${testCards}</div>`;
}

function tHomework(){
  const list = D.homework.filter(h=>mySubjects().includes(h.subject));
  const sel = byId(list, st.openHw) || list[0];
  const items = list.map(h => `<div class="card hwitem ${sel && h.id===sel.id?'on':''}" data-action="open-hw" data-id="${h.id}"><b>${esc(h.title)}</b><p class="hint sumline">${esc(h.cls)} · ${esc(h.subject)} · due <span class="mono">${esc(h.due)}</span></p></div>`).join('');
  let main = '<p class="muted">No homework yet.</p>';
  if(sel){
    const rows = sel.subs.map(x => {
      const s = byId(D.students, x.sid);
      const action = x.work ? `<button data-action="open-file" data-key="hw:${sel.id}:${x.sid}">Open & remark</button>` : '';
      return `<tr><td>${esc(s.name)}</td><td>${x.done?chip('pass','Submitted'):chip('pend','Not submitted')}</td><td>${x.work?esc(x.work.name):'–'}</td><td>${esc(x.remark)||'<span class="muted">–</span>'}</td><td>${action}</td></tr>`;
    }).join('');
    const materials = (sel.material||[]).map((m,i) => openBtn(`hm:${sel.id}:${i}`, m.name)).join(' ') || '<span class="hint">No question paper or material attached.</span>';
    main = `<h3>${esc(sel.title)}</h3>
      <p class="sumline"><b>Question paper and material</b></p><p>${materials}</p>
      <div class="tablewrap"><table><tr><th>Student</th><th>Status</th><th>Submitted work</th><th>Remark</th><th></th></tr>${rows}</table></div>`;
  }
  const form = st.hwForm ? `<div class="card"><h3>New homework</h3>
    <label>Title<input id="h-title"></label>
    <label>Due date<input id="h-due" type="date" value="2026-10-15"></label>
    <label>Subject<select id="h-sub">${mySubjects().map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
    <button data-action="post-hw">Post to Class 4</button></div>` : '';
  return `<div class="head"><h1>Homework</h1><button data-action="toggle" data-k="hwForm">${st.hwForm?'Close':'New homework'}</button></div>
    ${form}
    <div class="split"><div>${items}</div><div>${main}</div></div>`;
}

function tTests(){
  const list = D.tests.filter(x=>mySubjects().includes(x.subject));
  const sel = byId(list, st.testId) || list[0];
  let main = '<p class="muted">No tests yet.</p>';
  if(sel){
    const pend = Object.values(sel.marks).filter(m=>m==null).length;
    const rows = studentsIn(sel.cls).map(s => {
      const m = sel.marks[s.id];
      const ans = sel.answers?.[s.id];
      const answerCell = ans ? `<button data-action="open-file" data-key="ta:${sel.id}:${s.id}">Open & grade</button>` : chip('pend','No answer');
      return `<tr><td>${esc(s.name)}</td><td>${answerCell}</td><td class="mono">${m==null?'–':m+' / '+sel.max}</td><td>${scoreChip(m, sel.max, sel.pass)}</td><td>${esc(sel.remarks?.[s.id]) || '<span class="muted">–</span>'}</td></tr>`;
    }).join('');
    main = `<div class="head"><span class="muted">${pend} not graded</span>
      <div>${openBtn(`tp:${sel.id}`,'Question paper')} <button data-action="release" data-id="${sel.id}">${sel.released?'Release again':'Release grades to class'}</button></div></div>
      <div class="tablewrap"><table><tr><th>Student</th><th>Answer</th><th>Marks</th><th>Result</th><th>Remark</th></tr>${rows}</table></div>`;
  }
  const items = list.map(x => `<div class="card hwitem ${sel && x.id===sel.id?'on':''}" data-action="open-test" data-id="${x.id}"><b>${esc(x.term)} · ${esc(x.subject)}</b><p class="hint sumline">${esc(x.cls)} · pass ${x.pass}/${x.max}</p></div>`).join('');
  return `<h1>Tests & grading</h1><div class="split"><div>${items}</div><div>${main}</div></div>`;
}

function sHomework(){
  const me = ME.student.id;

  const cards = list.map(h => {
    const x = h.subs.find(s=>s.sid===me);

      <div class="head"><div><h3>${esc(h.title)}</h3><p class="hint">${esc(h.subject)} · due <span class="mono">${esc(h.due)}</span></p></div>${x.done?chip('pass','Submitted'):chip('pend','Pending')}</div>
      <p class="sumline"><b>Question paper and material</b></p>
      <p>${mats}</p>
      <p class="sumline"><b>Your work</b> ${x.work ? openBtn(`hw:${h.id}:${me}`, x.work.name) : '<span class="hint">Not uploaded yet</span>'}</p>

function sTests(){
  const me = ME.student.id;
  const list = D.tests.filter(x=>x.cls==='Class 4');
  const cards = list.map(x => {
    const mine = x.answers?.[me];
    return `<div class="card">
      <div class="head"><div><h3>${esc(x.subject)} · ${esc(x.term)}</h3><p class="hint">Out of ${x.max}</p></div>${mine?chip('pass','Answer uploaded'):chip('pend','Not submitted')}</div>

  }).join('');
  return `<h1>Tests</h1>${cards}`;
}

function sResults(){
  const me = ME.student.id;
  const rows = D.tests.filter(x=>x.cls==='Class 4').map(x => {
    const m = x.marks[me];
    return `<tr><td>${esc(x.subject)}</td><td>${esc(x.term)}</td><td class="mono">${m==null?'–':m+' / '+x.max}</td><td>${scoreChip(m, x.max, x.pass)}</td><td>${esc(x.remarks?.[me]) || '<span class="muted">–</span>'}</td></tr>`;

    <div class="tablewrap"><table><tr><th>Subject</th><th>Test</th><th>Marks</th><th>Result</th><th>Remark</th></tr>${rows}</table></div>

/* ---------- Router ---------- */
const VIEWS = {
  principal:{dashboard:pDashboard,teachers:pTeachers,students:pStudents,promotion:pPromotion,sessions:pSessions,announcements:pAnnouncements},
  teacher:{dashboard:tDashboard,homework:tHomework,tests:tTests},
  student:{dashboard:sDashboard,homework:sHomework,tests:sTests,results:sResults}
};

function render(){
  if(location.hash !== st.lastHash){
    st.lastHash = location.hash;
    st.fileKey = null;
    if($('#viewer').open) $('#viewer').close();
  }
  const app = $('#app');
  if(!st.role){ app.innerHTML = login(); return; }
  let page = location.hash.replace('#','').split('/')[1] || 'dashboard';
  if(!VIEWS[st.role][page]) page = 'dashboard';
  app.innerHTML = shell(page, VIEWS[st.role][page]());
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el || el.disabled) return;
  const a = el.dataset.action, id = el.dataset.id;

  if(a==='login'){
    st.role = el.dataset.role; st.bell = false;
    const [bg, fg] = ACCENT[st.role];
    document.documentElement.style.setProperty('--accent', bg);
    document.documentElement.style.setProperty('--accent-fg', fg);
    location.hash = `#${st.role}/dashboard`;
    return render();
  }
  if(a==='logout'){
    st.role = null; st.bell = false;
    history.replaceState(null,'',location.pathname+location.search);
    return render();
  }
  if(a==='bell'){ st.bell = !st.bell; if(st.bell) st.unread = 0; return render(); }
  if(a==='toggle'){ st[el.dataset.k] = !st[el.dataset.k]; return render(); }

  if(a==='open-file'){ st.fileKey = el.dataset.key; st.page = 0; return openPopup(); }
  if(a==='close-file'){ $('#viewer').close(); return; }
  if(a==='page'){
    const f = fileFor(st.fileKey);
    const max = (f?.pages?.length || 1) - 1;
    st.page = Math.min(max, Math.max(0, st.page + Number(el.dataset.d)));
    return renderPopup();
  }
  if(a==='save-remark'){
    const h = byId(D.homework, id);
    const x = h.subs.find(s=>s.sid===el.dataset.sid);
    x.remark = $('#r-text').value.trim();
    $('#viewer').close();
    if(x.remark){ note(`Remark added on ${h.title}`); flash('Remark saved. Student notified.'); }
    else flash('Remark cleared.');
    return render();
  }
  if(a==='save-grade'){
    const ts = byId(D.tests, id);
    const sid = el.dataset.sid;
    const raw = $('#g-marks').value.trim();
    ts.marks[sid] = raw === '' ? null : Math.max(0, Math.min(ts.max, Number(raw)));
    ts.remarks = ts.remarks || {};
    ts.remarks[sid] = $('#g-remark').value.trim();
    $('#viewer').close();
    flash(ts.marks[sid] == null ? 'Remark saved. Marks still pending.' : 'Marks and remark saved.');
    return render();
  }

  if(a==='toggle-teacher'){
    const t = byId(D.teachers, id); t.active = !t.active;
    flash(t.active ? `${t.name} reactivated.` : `${t.name} deactivated. Login blocked, history kept.`);
    return render();
  }
  if(a==='add-teacher'){
    const name = $('#t-name').value.trim();
    if(!name) return flash('Name is required.');
    const subjects = [...document.querySelectorAll('.t-sub:checked')].map(c=>c.value);
    const n = D.teachers.length + 1;
    D.teachers.push({id:'t'+n, name, phone:$('#t-phone').value.trim(), subjects, active:true});
    st.teacherForm = false;
    flash(`Teacher created. Temporary password: Tmp-${String(Math.floor(Math.random()*1e4)).padStart(4,'0')}`);
    return render();
  }
  if(a==='withdraw'){ byId(D.students, id).status = 'withdrawn'; flash('Marked withdrawn. Login disabled.'); return render(); }
  if(a==='enroll'){
    const name = $('#s-name').value.trim();
    if(!name) return flash('Name is required.');
    const n = D.students.length + 1;
    const school = $('#s-school').value.trim() || `ND-2026-${String(n).padStart(4,'0')}`;
    D.students.push({id:'s'+n, name, school, cls:$('#s-cls').value, status:'enrolled'});
    st.enrollForm = false;
    flash(`Enrolled. School ID ${school}. Temporary password shown once.`);
    return render();
  }
  if(a==='promo-check'){ st.promoChecked[id] = !st.promoChecked[id]; return render(); }
  if(a==='promote'){
    const list = studentsIn('Class 4');
    const sel = list.filter(s=>st.promoChecked[s.id]).length;
    return flash(`Saved: ${sel} promoted, ${list.length-sel} retained into ${D.session.upcoming}.`);
  }
  if(a==='activate-next'){
    D.session.history.push(D.session.active);
    D.session.active = D.session.upcoming;
    D.session.upcoming = null;
    flash(`${D.session.active} is now the active session.`);
    return render();
  }
  if(a==='create-session'){
    D.session.upcoming = nextLabel(D.session.active);
    flash(`${D.session.upcoming} created as upcoming. Classes and subjects were set up from the template.`);
    return render();
  }
  if(a==='publish'){
    const title = $('#a-title').value.trim();
    if(!title) return flash('Title is required.');
    D.announcements.unshift({id:'a'+(D.announcements.length+1), title, body:$('#a-body').value.trim(), by:ME.principal.name});
    note(`Announcement: ${title}`);
    st.annForm = false;
    flash('Published to everyone.');
    return render();
  }

  if(a==='open-hw'){ st.openHw = id; return render(); }
  if(a==='post-hw'){
    const title = $('#h-title').value.trim();
    if(!title) return flash('Title is required.');
    const subject = $('#h-sub').value;
    const n = D.homework.length + 1;
    D.homework.push({id:'h'+n, cls:'Class 4', subject, title, due:$('#h-due').value, material:[], subs:studentsIn('Class 4').map(s=>({sid:s.id,done:false,work:null,remark:''}))});
    note(`New homework: Class 4 ${subject}, ${title}`);
    st.hwForm = false; st.openHw = 'h'+n;
    flash('Homework posted. Class notified.');
    return render();
  }
  if(a==='open-test'){ st.testId = id; return render(); }
  if(a==='release'){
    const ts = byId(D.tests, id);
    const pend = Object.values(ts.marks).filter(m=>m==null).length;
    ts.released = true;
    note(`Grades released: ${ts.cls} ${ts.subject}, ${ts.term}`);
    flash(pend ? `Released. ${pend} student(s) still ungraded.` : 'Grades released. Class notified.');
    return render();
  }
});

document.addEventListener('input', e => {
  if(e.target.id !== 'g-marks') return;
  const max = Number(e.target.dataset.max), pass = Number(e.target.dataset.pass);
  const raw = e.target.value.trim();
  $('#g-result').innerHTML = scoreChip(raw===''?null:Math.min(max,Number(raw)), max, pass);
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.upload){
    const f = t.files[0];
    if(!f) return;
    readFile(f, work => {
      const h = byId(D.homework, t.dataset.upload);
      const x = h.subs.find(s=>s.sid===ME.student.id);
      x.work = work; x.done = true;
      flash(`Uploaded ${work.name}`);
      render();
    });
    return;
  }
  if(t.dataset.uploadTest){
    const f = t.files[0];
    if(!f) return;
    readFile(f, work => {
      const ts = byId(D.tests, t.dataset.uploadTest);
      ts.answers = ts.answers || {};
      ts.answers[ME.student.id] = work;
      ts.answered[ME.student.id] = true;
      flash(`Answer uploaded: ${work.name}`);
      render();
    });
    return;
  }
});

window.addEventListener('hashchange', render);
render();
</script>
